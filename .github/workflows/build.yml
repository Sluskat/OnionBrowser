name: Build Onion Browser IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # Step 1: Checkout your repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Build the app (no signing required)
    - name: Build with xcodebuild
      run: |
        xcodebuild \
          -project OnionBrowser.xcodeproj \
          -scheme OnionBrowser \
          -configuration Release \
          -archivePath build/OnionBrowser.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    # Step 3: Export IPA (using ExportOptions.plist)
    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/OnionBrowser.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist

    # Step 4: Upload IPA artifact
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnionBrowser-IPA
        path: build/*.ipa
