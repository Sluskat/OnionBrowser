name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Disable code signing
      run: |
        /usr/libexec/PlistBuddy -c "Set :CODE_SIGNING_REQUIRED NO" OnionBrowser/OnionBrowser.xcodeproj/project.pbxproj
        /usr/libexec/PlistBuddy -c "Set :CODE_SIGN_IDENTITY ''" OnionBrowser/OnionBrowser.xcodeproj/project.pbxproj

    - name: Build with xcodebuild
      run: |
        xcodebuild \
          -project OnionBrowser/OnionBrowser.xcodeproj \
          -scheme OnionBrowser \
          -configuration Release \
          -archivePath build/OnionBrowser.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/OnionBrowser.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnionBrowser-IPA
        path: build/*.ipa
