name: Build Onion Browser IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # Step 1: Checkout your repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Build Onion Browser using the marketplace action
    - name: iOS Build
      uses: hectorguerrini/build-ios-action@v1.0.4
      with:
        project-path: OnionBrowser.xcodeproj       # path to your .xcodeproj in root
        scheme: OnionBrowser                       # scheme to build
        configuration: Release                     # Release build
        export-method: development                 # dev IPA for sideloading
        disable-targets: OnionBrowser             # disables automatic signing
        output-path: build/OnionBrowser.ipa       # where the IPA will be saved
